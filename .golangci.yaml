version: "2"
run:
  tests: false
linters:
  settings:
    depguard:
      rules:
        main:
          files:
            - $all
            - '!$test'
          allow:
            - $gostd
            - github.com/rs/zerolog
            - github.com/rs/zerolog/log
            - github.com/rs/zerolog/hlog
            - github.com/rs/xid
            - github.com/ninlil/butler/log
            - github.com/ninlil/butler/router
            - github.com/ninlil/butler/runtime
            - github.com/ninlil/butler/workers
            - github.com/ninlil/butler/bufferedresponse
            - github.com/justinas/alice
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - ^examples/
      - _test\.go$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - ^examples/
      - _test\.go$
